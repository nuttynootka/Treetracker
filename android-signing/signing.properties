# Committed on purpose (owner's choice): the same key must sign every build so updates
# install over the old app and keep its data. Anyone who can read this repository could
# sign an app that Android accepts as a TreeTracker update.
storeFile=../../android-signing/treetracker.jks
storePassword=treetracker-owner
keyAlias=treetracker
keyPassword=treetracker-owner
