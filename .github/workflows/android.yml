name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Screen tests
        run: npx playwright install --with-deps chromium && npm run e2e

      - name: Build web app and copy into Android project
        run: npm run build && npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TreeTracker-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TreeTracker-1.0.${{ github.run_number }}
          path: TreeTracker-1.0.${{ github.run_number }}.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest TreeTracker-1.0.${{ github.run_number }}.apk \
            --title "TreeTracker (latest build)" \
            --notes "Version 1.0.${{ github.run_number }}, built from ${{ github.sha }}. Download the .apk file below on your phone." \
            --target ${{ github.sha }}
