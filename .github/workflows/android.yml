# Do not rename this workflow or this file. The APK version number comes from
# github.run_number, which restarts at 1 for a renamed workflow; Android then refuses
# to install the new build over the old one until the app is uninstalled (erasing its data).
name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two quick pushes cannot race to replace the "latest" release.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Screen tests
        run: npx playwright install --with-deps chromium && npm run e2e

      - name: Build web app and copy into Android project
        run: npm run build && npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TreeTracker-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TreeTracker-1.0.${{ github.run_number }}
          path: TreeTracker-1.0.${{ github.run_number }}.apk

      # A late or re-run build of an older commit must never replace a newer release.
      - name: Check this is the newest commit on the branch
        id: newest
        run: |
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not publishing: ${GITHUB_SHA} is no longer the newest commit on ${GITHUB_REF_NAME}."
          fi

      - name: Publish as the "latest" release
        if: steps.newest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest TreeTracker-1.0.${{ github.run_number }}.apk \
            --title "TreeTracker (latest build)" \
            --notes "Version 1.0.${{ github.run_number }}, built from ${{ github.sha }}. Download the .apk file below on your phone." \
            --target ${{ github.sha }}
